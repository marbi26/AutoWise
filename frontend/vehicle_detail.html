<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Details — AutoWise</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <span>⚡</span> Auto<span class="accent">Wise</span>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/vehicles.html" class="active">Browse Vehicles</a></li>
        <li><a href="/recommendations.html">AI Recommender</a></li>
        <li><a href="/prediction.html">Price Prediction</a></li>
        <li><a href="/compare.html">Compare</a></li>
        <li><a href="/ownership.html">Ownership Cost</a></li>
        <li><a href="/admin_analytics.html">Analytics</a></li>
      </ul>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </header>

  <main class="container" style="padding: 3rem 1.5rem 5rem 1.5rem;" id="detail-container">
    <div style="text-align: center; padding: 4rem;">
      <p class="text-muted">Loading vehicle specifications...</p>
    </div>
  </main>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const params = AutoWiseUtils.getUrlParams();
      const vehicleId = params.id;
      if (!vehicleId) {
        document.getElementById("detail-container").innerHTML = `
          <div style="text-align: center; padding: 4rem;">
            <h2>No vehicle specified</h2>
            <p class="text-muted" style="margin-bottom: 1.5rem;">Please select a vehicle from our catalog.</p>
            <a href="/vehicles.html" class="btn btn-primary">Go to Catalog</a>
          </div>
        `;
        return;
      }

      try {
        const data = await AutoWiseAPI.getVehicleDetail(vehicleId);
        const v = data.vehicle;
        const similar = data.similar_vehicles || [];

        // Log view interaction
        AutoWiseAPI.request("/api/interactions", {
          method: "POST",
          body: JSON.stringify({ vehicle_id: v.vehicle_id, interaction_type: "view" })
        }).catch(() => {});

        document.title = `${v.brand} ${v.model} Specs & Price — AutoWise`;

        const isCar = v.category === "car";

        document.getElementById("detail-container").innerHTML = `
          <!-- Breadcrumb & Header -->
          <div style="margin-bottom: 2rem;">
            <a href="/vehicles.html" class="text-muted" style="font-size: 0.88rem;">← Back to Catalog</a>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-top: 0.5rem; flex-wrap: wrap; gap: 1rem;">
              <div>
                <span class="badge ${isCar ? 'badge-blue' : 'badge-purple'}">${v.body_type || v.category}</span>
                <h1 style="margin: 0.35rem 0 0.2rem 0;">${v.brand} ${v.model}</h1>
                <p class="text-muted">${v.variant || 'Standard'} • Model Year ${v.year}</p>
              </div>
              <div style="display: flex; gap: 0.75rem;">
                <button class="btn btn-secondary" onclick="saveToProfile('${v.vehicle_id}')">♥ Save Vehicle</button>
                <a href="/compare.html?ids=${v.vehicle_id}" class="btn btn-outline">⚖️ Compare</a>
                <a href="/ownership.html?id=${v.vehicle_id}" class="btn btn-primary">💰 Ownership Cost</a>
              </div>
            </div>
          </div>

          <!-- Hero Grid: Image + Pricing Breakdown -->
          <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 2rem; margin-bottom: 3rem;">
            <div style="border-radius: var(--radius-xl); overflow: hidden; height: 380px; background: #111827; border: 1px solid var(--border-color);">
              <img src="${v.image_url || '/static/images/' + v.category + '/default.jpg'}" alt="${v.brand} ${v.model}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=800&auto=format&fit=crop&q=80'">
            </div>

            <!-- Price Card -->
            <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <span class="badge badge-green" style="margin-bottom: 0.75rem;">Verified ARAI Pricing</span>
                <span class="spec-label">Ex-Showroom Price</span>
                <div style="font-size: 2.5rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.25rem;">
                  ${AutoWiseUtils.formatINR(v.price_ex_showroom, true)}
                </div>
                <div class="text-muted" style="font-size: 0.95rem; margin-bottom: 1.5rem;">(${AutoWiseUtils.formatINR(v.price_ex_showroom)})</div>

                <div style="background: var(--bg-secondary); border-radius: var(--radius-md); padding: 1.25rem; border: 1px solid var(--border-color); margin-bottom: 1.5rem;">
                  <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem;">
                    <span class="text-muted">Estimated On-Road Price:</span>
                    <strong style="color: var(--accent-cyan); font-size: 1.1rem;">${AutoWiseUtils.formatINR(v.on_road_price_est)}</strong>
                  </div>
                  <div style="display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-muted);">
                    <span>Includes RTO Tax & Registration:</span>
                    <span>~₹${Math.round(v.price_ex_showroom * 0.11).toLocaleString('en-IN')}</span>
                  </div>
                  <div style="display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-muted); margin-top: 0.25rem;">
                    <span>Comprehensive Insurance Estimate:</span>
                    <span>~₹${Math.round(v.price_ex_showroom * 0.035).toLocaleString('en-IN')}</span>
                  </div>
                </div>
              </div>

              <!-- Quick Specs Highlights -->
              <div class="grid grid-3" style="text-align: center; background: rgba(37, 99, 235, 0.05); padding: 1rem; border-radius: var(--radius-md); border: 1px solid rgba(37, 99, 235, 0.2);">
                <div>
                  <span class="spec-label">ARAI Mileage</span>
                  <strong style="color: var(--accent-green); font-size: 1.05rem;">${v.mileage_kmpl} kmpl</strong>
                </div>
                <div>
                  <span class="spec-label">Power</span>
                  <strong style="color: var(--accent-blue); font-size: 1.05rem;">${v.power_bhp} bhp</strong>
                </div>
                <div>
                  <span class="spec-label">Safety Rating</span>
                  <strong style="color: var(--accent-amber); font-size: 1.05rem;">${v.safety_rating ? v.safety_rating + ' ★' : 'N/A'}</strong>
                </div>
              </div>
            </div>
          </div>

          <!-- Detailed Technical Specifications -->
          <div style="margin-bottom: 3rem;">
            <h3 style="margin-bottom: 1.25rem;">Technical Specifications</h3>
            <div class="card" style="padding: 0; overflow: hidden;">
              <table class="comparison-table">
                <tbody>
                  <tr><th style="width: 35%;">Powertrain & Engine</th><td>${v.engine_cc ? v.engine_cc + ' cc' : 'Electric Motor'} (${v.fuel_type})</td></tr>
                  <tr><th>Maximum Power</th><td>${v.power_bhp} bhp</td></tr>
                  <tr><th>Peak Torque</th><td>${v.torque_nm} Nm</td></tr>
                  <tr><th>Transmission</th><td>${v.transmission}</td></tr>
                  <tr><th>Certified Mileage (ARAI)</th><td>${v.mileage_kmpl} kmpl</td></tr>
                  <tr><th>Safety Certification</th><td>${v.safety_rating ? v.safety_rating + ' Star Global / Bharat NCAP' : 'Standard Factory Safety Pack'}</td></tr>
                  ${isCar ? `<tr><th>Seating Capacity</th><td>${v.seating_capacity} Persons</td></tr>` : ''}
                  ${isCar ? `<tr><th>Boot Capacity</th><td>${v.boot_space_l} Litres</td></tr>` : (v.boot_space_l > 0 ? `<tr><th>Under-Seat Storage</th><td>${v.boot_space_l} Litres</td></tr>` : '')}
                  <tr><th>Recommended Usage</th><td>${v.usage_suitability || 'Mixed City & Highway'}</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Features & Equipment -->
          ${v.features && v.features.length > 0 ? `
            <div style="margin-bottom: 3rem;">
              <h3 style="margin-bottom: 1.25rem;">Key Equipment & Technology</h3>
              <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                ${v.features.map(f => `<span class="badge badge-blue" style="font-size: 0.85rem; padding: 0.5rem 1rem;">✓ ${f}</span>`).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Similar Vehicles Section (KNN Recommender) -->
          ${similar && similar.length > 0 ? `
            <div style="margin-top: 4rem; border-top: 1px solid var(--border-color); padding-top: 3rem;">
              <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem;">
                <div>
                  <span class="badge badge-purple" style="margin-bottom: 0.5rem;">KNN Similarity Match</span>
                  <h3>Similar Alternatives in Specification & Segment</h3>
                </div>
              </div>
              <div class="grid grid-4">
                ${similar.map(s => {
                  const sv = s.vehicle;
                  return `
                    <div class="vehicle-card">
                      <div class="vehicle-card-img-wrapper" style="height: 150px;">
                        <img src="${sv.image_url || '/static/images/' + sv.category + '/default.jpg'}" alt="${sv.brand} ${sv.model}" class="vehicle-card-img" onerror="this.src='https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=400&auto=format&fit=crop&q=80'">
                        <span class="vehicle-card-badge badge badge-blue">${s.similarity_score}% Match</span>
                      </div>
                      <div class="vehicle-card-body" style="padding: 1rem;">
                        <span class="vehicle-brand">${sv.brand}</span>
                        <div class="vehicle-name" style="font-size: 1rem;">${sv.model}</div>
                        <div class="vehicle-price" style="font-size: 1.1rem; margin-top: 0.5rem;">${AutoWiseUtils.formatINR(sv.price_ex_showroom, true)}</div>
                        <div style="margin-top: 0.75rem;">
                          <a href="/vehicle_detail.html?id=${sv.vehicle_id}" class="btn btn-outline btn-sm" style="width: 100%;">View Alternative</a>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}
        `;
      } catch (e) {
        document.getElementById("detail-container").innerHTML = `
          <div style="text-align: center; padding: 4rem;">
            <h2>Error loading vehicle</h2>
            <p class="text-muted">${e.message}</p>
            <a href="/vehicles.html" class="btn btn-primary" style="margin-top: 1rem;">Back to Catalog</a>
          </div>
        `;
      }
    });

    async function saveToProfile(vehicleId) {
      if (!AutoWiseAPI.getToken()) {
        AutoWiseUtils.showToast("Please log in to save vehicles", "info");
        setTimeout(() => window.location.href = "/login.html", 1000);
        return;
      }
      try {
        const res = await AutoWiseAPI.saveVehicle(vehicleId);
        AutoWiseUtils.showToast(res.message, "success");
      } catch (e) {
        AutoWiseUtils.showToast(e.message, "error");
      }
    }
  </script>
</body>
</html>
