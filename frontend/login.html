<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — AutoWise</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body style="background: radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.12) 0%, rgba(10, 14, 23, 1) 70%);">

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <span>⚡</span> Auto<span class="accent">Wise</span>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/vehicles.html">Browse Vehicles</a></li>
        <li><a href="/recommendations.html">AI Recommender</a></li>
        <li><a href="/prediction.html">Price Prediction</a></li>
        <li><a href="/compare.html">Compare</a></li>
        <li><a href="/ownership.html">Ownership Cost</a></li>
        <li><a href="/admin_analytics.html">Analytics</a></li>
      </ul>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </header>

  <main class="container" style="padding: 5rem 1.5rem; display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); padding: 2.5rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-logo" style="justify-content: center; font-size: 1.8rem; margin-bottom: 0.5rem;">
          <span>⚡</span> Auto<span class="accent">Wise</span>
        </div>
        <h2 style="font-size: 1.5rem;">Welcome Back</h2>
        <p class="text-muted" style="font-size: 0.9rem;">Sign in to your account to view saved vehicles & recommendation history.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="login-username" class="form-control" placeholder="Enter your username" required>
        </div>

        <div class="form-group" style="margin-bottom: 1.75rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <label class="form-label" style="margin: 0;">Password</label>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 1.25rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
        Don't have an account? <a href="/register.html" style="color: var(--accent-cyan); font-weight: 600;">Create Account</a>
      </div>
    </div>
  </main>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // If already logged in, redirect to dashboard
      if (AutoWiseAPI.getToken()) {
        window.location.href = "/dashboard.html";
      }

      const form = document.getElementById("login-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value;
        const btn = form.querySelector('button[type="submit"]');

        btn.disabled = true;
        btn.textContent = "Authenticating...";

        try {
          const res = await AutoWiseAPI.login(username, password);
          AutoWiseUtils.showToast("Signed in successfully! Redirecting...", "success");
          
          const params = AutoWiseUtils.getUrlParams();
          const redirect = params.redirect || "/dashboard.html";
          setTimeout(() => {
            window.location.href = redirect;
          }, 800);
        } catch (err) {
          AutoWiseUtils.showToast(err.message, "error");
          btn.disabled = false;
          btn.textContent = "Sign In";
        }
      });
    });
  </script>
</body>
</html>
